{% extends "base.html" %}

{% block content %}

<h2>Admin Dashboard</h2>

<a href="/upload" class="btn btn-success mb-3">
    Upload Material
</a>

{% for material in materials %}

<div class="card shadow mb-3">
    <div class="card-body">

        <h5>{{ material.title }}</h5>

        <p><b>Category:</b> {{ material.category }}</p>

        <p>{{ material.description }}</p>

        <a href="/edit/{{ material.id }}" class="btn btn-primary">
            Edit
        </a>

        <form action="/delete/{{ material.id }}" method="POST"
              style="display:inline;"
              onsubmit="return confirm('Delete this material permanently?');">

            <button class="btn btn-danger">
                Delete
            </button>

        </form>

    </div>
</div>

{% else %}

<p>No uploaded materials yet.</p>

{% endfor %}

<a href="/logout" class="btn btn-outline-danger">
    Logout
</a>

{% endblock %}
